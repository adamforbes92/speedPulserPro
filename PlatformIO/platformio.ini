; SpeedPulser Pro — one codebase, two PCB families. Pick the board with -e:
;
;   pio run -e esp32doit-devkit-v1     ESP32 DevKit V1 boards: PWM motor drive only
;                                      (no voltage injection / rail sense / VR / bias)
;   pio run -e esp32-s3                ESP32-S3-WROOM-1-N16R8 board (PCBs/rev6-allConfirmed):
;                                      native USB, buck voltage injection + rail sense,
;                                      MAX9924 VR input, switched speed-input bias
;
;   pio run -e <env> -t buildfs / -t uploadfs    LittleFS web-UI image (data/)
;   python tools/make_release.py --env <env>     package Releases/V<ver>/ (or V<ver>-S3/)
;
; Each env sets ONE of -DSPP_BOARD_DEVKIT / -DSPP_BOARD_S3; everything
; board-specific keys off those in include/SpeedPulserPro_board.h + _config.h.

[platformio]
default_envs = esp32doit-devkit-v1
; Keep transient build/dependency files off the Google-Drive folder — Drive
; locking cached library build dirs causes spurious full rebuilds and
; "[WinError 5] Access is denied" / "[WinError 145] directory is not empty".
; Own folder per version so V5.02 and V5.03 don't overwrite each other's build.
; Needed even with the machine-wide PLATFORMIO_WORKSPACE_DIR: that names the tree
; after this folder ("V5.03.0 - Speed Source Fixes-<hash>") and esptool's elf2image
; splits the path at the spaces ("Path '-' does not exist").
build_dir = ${sysenv.SYSTEMDRIVE}/.platformio/speedpulserpro-v503-pio/build
libdeps_dir = ${sysenv.SYSTEMDRIVE}/.platformio/speedpulserpro-v503-pio/libdeps

; ---- shared by every board ----------------------------------------------------
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    RobTillaart/RunningMedian
    plerup/espsoftwareserial
    mikalhart/TinyGPSPlus
    mathieucarbou/ESPAsyncWebServer
    bblanchon/ArduinoJson
    mathieucarbou/AsyncTCP

; ---- ESP32 DevKit V1 (WROOM-32) boards: PWM motor drive only -------------------
[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
board_build.partitions = partitions_speedpulserpro.csv
build_flags =
    ${env.build_flags}
    -DSPP_BOARD_DEVKIT=1

; ---- S3 board (PCBs/rev6-allConfirmed): ESP32-S3-WROOM-1-N16R8 soldered down ---
[env:esp32-s3]
board = esp32-s3-devkitc-1
; The N16R8 module carries 16 MB flash; the devkitc-1 manifest assumes 8 MB, so
; both the builder and the uploader need telling.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.partitions = partitions_speedpulserpro_16MB.csv
; The module's 8 MB octal PSRAM is not needed by this firmware and is left
; disabled (nothing to probe at boot). To use it: add -DBOARD_HAS_PSRAM to
; build_flags and set  board_build.arduino.memory_type = qio_opi
;
; Console + esptool run over the module's native USB (IO19/IO20, USB-Serial-
; JTAG) — there is no CH340 on this board. Keep DTR/RTS deasserted so opening a
; serial monitor doesn't drop the chip into download mode.
monitor_dtr = 0
monitor_rts = 0
build_flags =
    ${env.build_flags}
    -DSPP_BOARD_S3=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
